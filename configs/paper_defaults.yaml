# Principal-run flags used by the recorded Tables III--IX commands.
# These override library argparse defaults. See docs/CODE_DEFAULTS_VS_PAPER.md.

paper_principal:
  seeds: [0, 1, 2]
  epochs: 80
  lr: 0.001
  max_residual_m: 1.0          # Table II r_max; library default is 1.5
  max_pair_dist_m: 2.0         # recorded principal-run flag; library default is 3.0
  max_time_gap: 0.35
  lambda_reg: 0.10             # Appendix E; recorded alpha/beta/gamma train flag (not argparse 0.05)
  lambda_smooth: 0.02
  min_teacher_confidence: 0.20
  min_teacher_confidence_gap: 0.05
  teacher_confidence_power: 1.0
  student_weight_floor: 0.05
  reg_confidence_floor: 0.25
  lambda_mean_delta: 1.0
  lambda_pair_center: 0.5
  min_mvc_pairs: 64
  risk_scalar: metric_jacobian
  anchor_mode: multiplicative_gating_offsetted
  s0_m: 60.0
  feature_l0_m: 10.0
  anchor_shape_eta: 0.75
  motion_compensation: linear_interpolate
  loss_mode: asymmetric_teacher
  camera_translation_acceptance: recommended
  stitch_enabled: false
  remerge_g2_for_merge: false

library_argparse_defaults_in_vendored_copies:
  max_residual_m: 1.5
  max_pair_dist_m: 3.0
  lambda_reg: 0.05
  lambda_mean_delta: 0.0
  lambda_pair_center: 0.0

appendix_e_method_defaults:
  L0_m: 10.0
  lambda_reg: 0.10
  lambda_s: 0.02
  gamma: 1.0
  phi0: 0.05
  r0: 0.25
  tau: 0.20
  tau_delta: 0.05
  eta_shape: 0.75
  rho_bar: [0.5, 3.0]
