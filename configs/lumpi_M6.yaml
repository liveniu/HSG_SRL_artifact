# Paper-site configuration for the HSG-SRL artifact.
# Licensed videos and first-frame images are not redistributed.
# Replace the data/external placeholders after you download the dataset.
#
# Import: python scripts/import_paper_sites.py --site <site>
# Train/eval: scripts/train_paper_sites.py and scripts/eval_paper_tables.py
# Fusion reads cameras, overlap, and merge gates. It does not read
# residual_train (importer-era leftover; paper train uses --max-pair-dist-m 2).
# Camera names must match importer camera_name values.
# Homographies come from import (--h-source model).

# LUMPI merge gates are slightly looser than Synthehicle.
# video/image paths are placeholders; image_roi is the fusion ground mask.

lumpi_experiment:
  measurement: 6
  scene_id: lumpi_M6
  db: data/work/<site>.db
  data_root: data/external/<licensed-dataset>
  cameras: [C05,C06,C07]
  overlap_pairs:
    - [C05, C06]
    - [C05, C07]
    - [C06, C07]
  frame_wh_by_camera:
    C05: [1920, 1080]
    C06: [1640, 1232]
    C07: [1640, 1232]
  residual_train:
    max_pair_dist_m: 80
    min_mvc_pairs: 32
    max_time_gap: 0.35
    checkpoint: results/checkpoints/<site>_residual.pt

scale_px_per_meter: 4.0
seam_blend_px: 15
canvas_margin_px: 60
output: outputs/lumpi_M6_bev.png
debug_dir: outputs/debug_lumpi

trajectory_merge:
  score_threshold: 0.70
  max_distance_m: 2.5
  distance_sigma: 1.5
  shape_sigma: 0.5


cameras:
